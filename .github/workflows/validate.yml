name: Validate kit invariants
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-kit.sh (structural)
        run: bash scripts/validate-kit.sh
      - name: Run validate-kit-v2.sh (content)
        run: bash scripts/validate-kit-v2.sh
